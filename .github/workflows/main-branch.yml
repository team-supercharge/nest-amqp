name: Build status

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  build-status:
    name: Build status on main branch
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install NPM dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build:prod
